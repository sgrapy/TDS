<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>La Taverne des Scores - Chargement en cours...</title>
  <link rel="icon" href="assets/pwa/taverne-icon.png">
  <link rel="manifest" href="site.webmanifest?v=0.6.7">
  <meta name="theme-color" content="#100b08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=0.6.7">
</head>
<body class="loading-page">
  <main class="loading-card" aria-live="polite">
    <h1>Chargement de la Taverne…</h1>
    <div class="loading-bar" aria-hidden="true"><div class="progress"></div></div>
    <p class="message" id="loadingMessage">Préparation de la potion magique…</p>
    <p class="loading-version">Taverne des Scores — Version 0.6.7</p>
  </main>

  <script>
    const messages = [
      'Mélange des jeux…',
      'Polissage des trophées…',
      'Affûtage des cartes…',
      'Chauffage des dés…',
      'Ouverture de la salle…'
    ];
    let index = 0;
    setInterval(() => {
      const el = document.getElementById('loadingMessage');
      if (el) el.textContent = messages[index++ % messages.length];
    }, 650);
    setTimeout(() => { window.location.href = 'home.html'; }, 2300);
  </script>
  <script src="orientationGuard.js?v=0.6.7" defer></script>
<script src="pwa-register.js?v=0.6.7" defer></script>
</body>
</html>
