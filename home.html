</head>
<body>
      <header>
       <h2>La taverne des scores</h2>
            </header>

    <main class="home-main">
        <div class="home-category-tabs" aria-label="Navigation des catégories">
            <button class="home-tab-btn is-active" type="button" data-home-target="classic">Jeux classiques</button>
            <button class="home-tab-btn" type="button" data-home-target="modern">Jeux modernes</button>
            <button class="home-tab-btn" type="button" data-home-target="outdoor">Jeux extérieur</button>
            <button class="home-tab-btn" type="button" data-home-target="create">Personnalisé</button>
        </div>
        <div class="home-columns">
            <div class="home-column home-column-classic">
                <section class="home-section home-section-classic is-home-tab-active" data-home-tab="classic">
                    <h2>Jeux classiques</h2>
                    <div class="game-grid classic-grid">
                        <button class="game-card" type="button" onclick="launchGame('belote-coinche')">
                            <img src="assets/games/belote.png" alt="Belote/coinche">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('tarot')">
                            <img src="assets/games/tarot.png" alt="Tarot">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('rami')">
                            <img src="assets/games/rami.png" alt="Rami">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('simonette')">
                            <img src="assets/games/simonette.png" alt="Simonette">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('tarotafricain')">
                            <img src="assets/games/tarotafricain.png" alt="Tarot Africain">
                        </button>
                    </div>
                </section>
            </div>

            <div class="home-column home-column-modern">
                <section class="home-section home-section-modern" data-home-tab="modern">
                    <h2>Jeux modernes</h2>
                    <div class="game-grid modern-grid">
                        <button class="game-card" type="button" onclick="launchGame('skyjo')">
                            <img src="assets/games/skyjo.png" alt="Skyjo">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('papayoo')">
                            <img src="assets/games/papayoo.png" alt="Papayoo">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('uno')">
                            <img src="assets/games/uno.png" alt="Uno">
                        </button>
                    </div>
                </section>

                <section class="home-section home-section-outdoor" data-home-tab="outdoor">
                    <h2>Jeux extérieur</h2>
                    <div class="game-grid outdoor-grid">
                        <button class="game-card" type="button" onclick="launchGame('palet breton')">
                            <img src="assets/games/paletbreton.png" alt="Palet Breton">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('molkky')">
                            <img src="assets/games/molkky.png" alt="Mölkky">
                        </button>
                        <button class="game-card" type="button" onclick="launchGame('petanque')">
                            <img src="assets/games/petanque.png" alt="Pétanque">
                        </button>
                    </div>
                </section>

                <section class="home-section home-section-create" data-home-tab="create">
                    <h2>Création de règle</h2>
                    <div class="game-grid create-grid">
                        <button class="game-card" type="button" onclick="launchGame('Création')">
                            <img src="assets/games/creation.png" alt="Création">
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>
    
    <div id="playerPopup" class="popup">
        <div class="popupContent">
          <h3>Gestion des Joueurs</h3>
          <div id="playerError" class="error-message" style="display:none;"></div>
      
          <!-- Grille des joueurs existants -->
          <div id="playersList" class="player-grid"></div>
          <hr>
      
          <!-- Formulaire Ajouter / Modifier -->
          <div id="newPlayerZone">
            <input type="text" id="newPlayerName" placeholder="Nom du joueur" />
            <div id="avatarOptions" class="avatar-grid"></div>
            <button id="savePlayerButton" class="close-btn"><img class="ui-icon" src="assets/icons/icon-add.png" alt=""> Ajouter</button>
            <button id="closePopupButton" class="close-btn"><img class="ui-icon" src="assets/icons/icon-close.png" alt=""> Fermer</button>
          </div>
        </div>
      </div>

<footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-brand" aria-label="Version de l’application">
        <span class="footer-emblem"><img src="assets/pwa/taverne-icon-192.png" alt=""></span>
        <span class="footer-title">Taverne des Scores</span>
        <span class="footer-version"><img class="ui-icon" src="assets/icons/icon-version.png" alt=""> V0.6.8</span>
      </div>

      <div class="footer-buttons">
        <button id="managePlayersButton" class="footer-btn"><img class="ui-icon" src="assets/icons/icon-players.png" alt=""> Joueurs</button>
        <button id="aboutFooterButton" class="footer-btn"><img class="ui-icon" src="assets/icons/icon-about.png" alt=""> À propos</button>
      </div>

      <div id="footerMessage">
        <p id="rotatingMessage">Bienvenue à la Taverne des Scores !</p>
      </div>
    </div>
  </footer>



    <script>
        function launchGame(gameName) {
            window.location.href = `jeu.html?game=${gameName}`;
        }
        // Tableau de phrases fun
const messages = [
    "Bienvenue à la Taverne des Scores !",
    "Ici, chaque victoire compte !",
    "Un point de plus, une légende en marche.",
    "Le destin est écrit... en chiffres.",
    "Moins de triche, plus de panache !",
    "Skyjo ou Belote, que le meilleur gagne !",
    "Serez-vous digne de votre équipe ?",
    "La gloire appartient aux persévérants.",
    "Un café, une partie, une victoire ?",
    "Vos scores racontent votre épopée."
];

// Fonction de changement de message
function rotateMessages() {
    const messageElement = document.getElementById('rotatingMessage');
    if (!messageElement) return;
    
    setInterval(() => {
        // Petit effet de fondu
        messageElement.style.opacity = 0;

        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * messages.length);
            messageElement.textContent = messages[randomIndex];
            messageElement.style.opacity = 0.9;
        }, 500); // Le temps de transition
    }, 6000); // Change toutes les 6 secondes
}

       
document.addEventListener('DOMContentLoaded', rotateMessages);
document.addEventListener('DOMContentLoaded', () => {
    const tabButtons = [...document.querySelectorAll('.home-tab-btn')];
    const tabSections = [...document.querySelectorAll('[data-home-tab]')];
    if (!tabButtons.length || !tabSections.length) return;

    const storageKey = 'tds-home-mobile-tab';

    function activateHomeTab(tabName) {
        tabButtons.forEach(btn => btn.classList.toggle('is-active', btn.dataset.homeTarget === tabName));
        tabSections.forEach(section => section.classList.toggle('is-home-tab-active', section.dataset.homeTab === tabName));
        try { localStorage.setItem(storageKey, tabName); } catch (error) {}
    }

    tabButtons.forEach(btn => {
        btn.addEventListener('click', () => activateHomeTab(btn.dataset.homeTarget));
    });

    let preferredTab = 'classic';
    try {
        const saved = localStorage.getItem(storageKey);
        if (saved && tabSections.some(section => section.dataset.homeTab === saved)) preferredTab = saved;
    } catch (error) {}
    activateHomeTab(preferredTab);
});
    </script>

<script src="saveManager.js?v=0.6.8" defer></script>
<script src="appUi.js?v=0.6.8" defer></script>
<script src="managePlayers.js?v=0.6.8" defer></script>
